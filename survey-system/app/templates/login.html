{% extends "base.html" %}
{% block title %}登录 · 问卷系统{% endblock %}
{% block content %}
<h1>登录</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next_url or '/surveys' }}">
  <p>
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" autocomplete="username" value="{{ username or '' }}">
    {% if errors and errors.username %}<span class="field-error">{{ errors.username }}</span>{% endif %}
  </p>
  <p>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    {% if errors and errors.password %}<span class="field-error">{{ errors.password }}</span>{% endif %}
  </p>
  <button type="submit">登录</button>
</form>
<p>还没有账号？<a href="/register">注册新账号</a></p>
{% endblock %}
