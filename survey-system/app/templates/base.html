<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}问卷系统{% endblock %}</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; color: #1f2933; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid #e4e7eb; }
    header .brand { font-weight: 700; text-decoration: none; color: #1f2933; }
    nav { display: flex; align-items: center; gap: 12px; }
    main { max-width: 720px; margin: 24px auto; padding: 0 24px; }
    form p { margin: 0 0 12px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 8px; border: 1px solid #cbd2d9; border-radius: 4px; box-sizing: border-box; }
    button { padding: 8px 16px; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
    .error { color: #b91c1c; }
    .field-error { color: #b91c1c; font-size: 0.9em; display: block; margin-top: 4px; }
    ul.surveys { list-style: none; padding: 0; }
    ul.surveys li { border: 1px solid #e4e7eb; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
    ul.surveys h2 { margin: 0 0 8px; font-size: 1.1em; }
    .status { color: #6b7280; font-size: 0.9em; }
    fieldset { border: 1px solid #e4e7eb; border-radius: 6px; margin: 0 0 12px; }
    fieldset label { font-weight: 400; display: block; margin-bottom: 4px; }
    .question { margin-bottom: 16px; }
    .link-box { background: #f0f4ff; border: 1px solid #c7d2fe; border-radius: 6px; padding: 12px 16px; }
    ul.selections li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/surveys">问卷系统</a>
    <nav>
      {% if current_user %}
        <span class="current-user">{{ current_user }}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit">退出</button>
        </form>
      {% else %}
        <a href="/login">登录</a>
        <a href="/register">注册</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
