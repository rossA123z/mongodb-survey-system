{% extends "base.html" %}
{% block title %}新建问卷 · 问卷系统{% endblock %}
{% block content %}
<h1>新建问卷</h1>
<form method="post" action="/surveys">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p>
    <label for="title">标题</label>
    <input id="title" name="title" type="text" value="{{ title or '' }}">
    {% if errors and errors.title %}<span class="field-error">{{ errors.title }}</span>{% endif %}
  </p>
  <p>
    <label for="description">说明</label>
    <textarea id="description" name="description" rows="4">{{ description or '' }}</textarea>
  </p>
  <button type="submit">创建草稿</button>
</form>
{% endblock %}
